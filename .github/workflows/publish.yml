name: Publish
# Publishes the package to npm through trusted publishing (OIDC): no npm token,
# no one-time password. npmjs.com must list this repository/workflow as a trusted
# publisher for prjlab-cli. Runs when a GitHub release is published.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - name: Refuse to publish a version that is not the release tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"
      - run: npm publish --provenance --access public
