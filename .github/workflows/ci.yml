name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-0 gnome-keyring dbus
      - run: npm rebuild keytar
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - if: runner.os == 'Linux'
        run: dbus-run-session -- bash scripts/test-secure-store-linux.sh
      - if: runner.os == 'Windows'
        run: node scripts/test-secure-store.mjs
      - if: runner.os == 'macOS'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/prjlab-test.keychain-db"
          security create-keychain -p "" "$keychain"
          security default-keychain -s "$keychain"
          security unlock-keychain -p "" "$keychain"
          trap 'security delete-keychain "$keychain"' EXIT
          node scripts/test-secure-store.mjs
      - run: npm audit --audit-level=high
      - run: npm run test:package
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          hide-progress: true
